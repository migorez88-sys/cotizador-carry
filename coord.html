<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cotizador por Coordenadas</title>
        <link rel="stylesheet" href="global.css">
        <link rel="stylesheet" href="coord.css">
    </head>
    <body>
        <div class="tarjeta_modulo">
            <!-- target="_self": Es el comportamiento por defecto. Si haces clic, el inicio (index.html) se abriría adentro
            del cuadrito chiquito del iframe, lo cual desarmaría visualmente tu layout.
            target="_blank": Abre explícitamente una pestaña nueva.
            target="_top": Le ordena al navegador: "Sal de cualquier iframe en el que estés atrapado y carga este nuevo
            enlace ocupando la ventana principal completa (la copa del árbol)", todo dentro de la misma pestaña actual.-->
            <a href="index.html"
               target="_top"
               class="btn_home_tarjeta" 
               title="Volver al Inicio">🏠
            </a>
            <select id="tipoTrafico_display" 
                    class="select_trafic" 
                    onchange="//procesarRutasYCalcular()" 
                    title="Estado del Tráfico">
                <option title="tráfico liviano" value="valle">🛣️</option>
                <option title="tráfico pesado" value="pico">🚗</option>
            </select>
            <h2>Cotizador Carry</h2>
<!--        Control de enlistamiento de puntos predederminado o guardados   -->
            <datalist id="puntos_guardados"></datalist>
            <div class="input_group">
                <label>🏠 Punto Base / Origen (Coordenadas Lat, Lng):</label>
                    <input type="text" 
                           id="puntoOrigen" 
                           list="puntos_guardados"
                           value=""
                           placeholder="3.437351, -76.506770">
                </div>
            <div class="input_group">
                <label>📍 Punto A (Recogida de Carga - Lat, Lng):</label>
                <input type="text" 
                       id="puntoA"
                       list="puntos_guardados"
                       value=""
                       placeholder="3.405144, -76.569511">
            </div>
            <div class="input_group">
                <label>🏁 Punto B (Destino de Entrega - Lat, Lng):</label>
                <input type="text" 
                       id="puntoB"                           
                       list="puntos_guardados"
                       value=""
                       placeholder="3.477987, -76.481571">
            </div>
            <div class="input_group">
                <label>🏢 Alternativa de Retorno (Si no retorna al origen - Lat, Lng):</label>
                <div class="tooltip_container" 
                     data-tooltip="Campo alternativo: señala el lugar a donde irás después de entregar la encomienda, si es que no terminas en el mismo origen de esta ruta. Si no lo llenas se asumirá que retornas al mismo punto de origen.">
                <input type="text" 
                       id="puntoAlterno"                           
                       list="puntos_guardados"
                       value=""
                       placeholder="3.477987, -76.481571">
                </div>
            </div>
            <div class="input_group">
                <label for="tipoCarga_display">📦 Tipo de Carga / Rodamiento:</label>
                <select id="tipoCarga_display" 
                        onchange="//procesarRutasYCalcular()">
                    <option value="suave">Suave</option>
                    <option value="moderada">Moderada</option>
                    <option value="sobredimensionada">Sobredimensionada</option>
                    <option value="critica">Crítica / Abrasiva</option>
                    <option value="pasajeros">Pasajeros</option>
                </select>
            </div>
            <div class="input_group">
                <label for="tipoOperacion_display">🌤️ Condición del Servicio:</label>
                <!-- Ejecuta la función de cálculo del módulo correspondiente cada vez que cambie -->
                <select id="tipoOperacion_display" 
                        onchange="//procesarRutasYCalcular()">
                    <option value="normal">Tasa Normal (Sin recargo)</option>
                    <option value="nocturno">Horario Nocturno / Festivo (+35%)</option>
                    <option value="trocha">Terreno Difícil / Trocha (+25%)</option>
                    <option value="descuento">Cliente Frecuente (-10%)</option>
                </select>
            </div>
            <div class="section_title">Extras y Logística</div>
            <div class="input_group" style="grid-template-columns: 3fr 1fr;">
                <label for="extras">🤝 Recargos Extra (Cargue / Ayudante / Peajes):</label>
                <input type="number" 
                       id="extras"
                       onkeypress="filtrarSoloNumeros(event)"
                       placeholder="10,000" 
                       value="">
            </div>
            <button class="main_btn btn_calc" 
                    onclick="procesarRutasYCalcular()">
                🔍 Calcular Ruta y Cotizar
            </button>
            <div class="loading" id="loadingMsg">🔄 Procesando circuito logístico...</div>
            <div class="result_box" id="resultBox">
                <div class="total_highlight" id="totalTarifa_display">$0</div>
                <div class="summary_text" id="summaryText"></div>
                <button class="main_btn btn_copy" id="btnCopy" onclick="copiarWhatsApp()">📋 Copiar para WhatsApp</button>
            </div>
        </div>
<!--        <script defer src="./localforage.min.js"></script>-->
        <script defer src="./init_globals.js"></script>
        <script defer src="./init_modules.js"></script>
        <script defer src="./coord.js"></script>
    </body>
</html>
